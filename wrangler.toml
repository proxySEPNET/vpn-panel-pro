name = "vpn-panel-pro"
main = "src/worker.js"
compatibility_date = "2025-06-28"
compatibility_flags = ["nodejs_compat"]

# KV Namespaces - rename these after creating in Cloudflare dashboard
[[kv_namespaces]]
binding = "USERS"
id = "YOUR_USERS_KV_ID"
preview_id = "YOUR_USERS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "PLANS"
id = "YOUR_PLANS_KV_ID"
preview_id = "YOUR_PLANS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "TRANSACTIONS"
id = "YOUR_TRANSACTIONS_KV_ID"
preview_id = "YOUR_TRANSACTIONS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "SETTINGS"
id = "YOUR_SETTINGS_KV_ID"
preview_id = "YOUR_SETTINGS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "LOGS"
id = "YOUR_LOGS_KV_ID"
preview_id = "YOUR_LOGS_KV_PREVIEW_ID"

# Environment Variables
[vars]
BOT_TOKEN = "8947533261:AAECpJIU_nH27P6r8MS4c6I9H1dPuH2pnVE"
BOT_USERNAME = "sepdl_bot"
ADMIN_IDS = "1327852418,1327852418"
PANEL_DOMAIN = "vpn-panel-pro.sepnet-peybot-d03.workers.dev"
SUB_DOMAIN = "vpn-panel-pro.sepnet-peybot-d03.workers.dev"
SITE_NAME = "VPN Panel Pro"
DEFAULT_LANG = "fa"

# Routes (uncomment and set your domain)
